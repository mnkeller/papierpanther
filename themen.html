<style>
  :root {
    --primary: #003e59;
    --primary-dark: #00263a;
    --accent: #b00e2b;
    --text: #16232b;
    --text-muted: #566a74;
    --text-faint: #5c6a72;
    --bg: #f8f7f4;
    --bg-warm: #f1efe9;
    --card: #ffffff;
    --border: #e4e0d8;
    --border-strong: #8f8779;
    --font-display: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(22,35,43,.06), 0 0 0 1px rgba(22,35,43,.04);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body); color: var(--text); background: var(--bg);
    line-height: 1.65; font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }
  a { color: var(--accent); }

  .site-header {
    background: var(--primary); border-bottom: 3px solid var(--accent);
    padding: .85rem 0; position: sticky; top: 0; z-index: 50;
  }
  .site-header .container { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
  .logo-mark { flex: none; display: block; }
  .brand {
    font-family: var(--font-display); font-size: 1.28rem; font-weight: 700;
    letter-spacing: -.01em; color: #fff; text-decoration: none;
  }
  .brand span { color: #a9c7d6; font-weight: 400; }
  .header-spacer { margin-left: auto; }
  .btn-zurueck {
    font-size: .82rem; font-weight: 600; text-decoration: none; color: #fff;
    background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: .3rem .85rem;
  }
  .btn-zurueck:hover { background: rgba(255,255,255,.14); }
  .btn-leicht {
    font: inherit; font-size: .82rem; cursor: pointer;
    background: none; border: 1px solid rgba(255,255,255,.5); color: #fff;
    padding: .3rem .75rem; border-radius: 999px;
  }
  .btn-leicht:hover { background: rgba(255,255,255,.14); }
  .btn-leicht[aria-pressed="true"] {
    background: #fff; color: var(--primary-dark); border-color: #fff; font-weight: 600;
  }

  .disclaimer {
    background: #fdf6e7; border-bottom: 1px solid #e8d9b0; color: #7d6320;
    font-size: .74rem; padding: .5rem 0;
  }
  .disclaimer strong { font-weight: 600; }
  .disclaimer p { max-width: 680px; }

  main { padding: 3rem 0 3.5rem; }
  h1 {
    font-family: var(--font-display); font-size: clamp(1.75rem, 4.5vw, 2.4rem);
    font-weight: 700; letter-spacing: -.02em; margin-bottom: .5rem;
    /* Ohne eigene Zeilenhoehe erbte die Ueberschrift 1.65 vom Fliesstext und
       zerfiel in zwei weit auseinanderstehende Zeilen. */
    line-height: 1.18; max-width: 30ch; text-wrap: balance;
  }
  .lede { color: var(--text-muted); font-size: 1.05rem; max-width: 62ch; margin-bottom: 1.75rem; }
  h2 {
    font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
    margin: 2.75rem 0 .6rem; letter-spacing: -.01em;
  }
  h3 {
    font-family: var(--font-display); font-size: 1.05rem; font-weight: 700;
    margin: 0 0 .4rem;
  }
  p { margin-bottom: 1rem; max-width: 68ch; }

  /* ---------- Kontakt-Karten: Vertreter:innen ansprechen ---------- */
  .kontakt-liste {
    display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    margin: 1.25rem 0 1rem;
  }
  .kontakt-karte {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1.25rem 1.35rem; display: flex; flex-direction: column;
  }
  .kontakt-karte h3 { color: var(--primary); }
  .kontakt-karte p { font-size: .92rem; color: var(--text-muted); flex: 1; margin-bottom: .9rem; }
  .kontakt-link {
    display: inline-block; align-self: flex-start; font-size: .86rem; font-weight: 600;
    text-decoration: none; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; padding: .4rem .8rem;
  }
  .kontakt-link:hover { background: var(--accent); color: #fff; }
  .kontakt-link::after { content: ' ↗'; opacity: .7; font-size: .9em; }

  /* ---------- Projekt-Karten: Beteiligungsprojekte der Stadt ---------- */
  .projekt-liste {
    display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    margin: 1.25rem 0 1.5rem;
  }
  .projekt-karte {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1.25rem 1.35rem; display: flex; flex-direction: column;
  }
  .projekt-karte p { font-size: .92rem; color: var(--text-muted); flex: 1; margin-bottom: .9rem; }
  .projekt-link {
    display: inline-block; align-self: flex-start; font-size: .86rem; font-weight: 600;
    text-decoration: none; color: var(--primary); border: 1px solid var(--primary);
    border-radius: 6px; padding: .4rem .8rem;
  }
  .projekt-link:hover { background: var(--primary); color: #fff; }
  .projekt-link::after { content: ' ↗'; opacity: .7; font-size: .9em; }

  .portal-cta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
    background: var(--bg-warm); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.3rem; margin-bottom: 1rem;
  }
  .portal-cta p { margin: 0; flex: 1; min-width: 220px; font-size: .95rem; color: var(--text-muted); }
  .btn-portal {
    display: inline-block; flex: none; font-size: .88rem; font-weight: 600; text-decoration: none;
    color: #fff; background: var(--primary); border-radius: 999px; padding: .55rem 1.2rem;
  }
  .btn-portal:hover { background: var(--primary-dark); }
  .btn-portal::after { content: ' ↗'; opacity: .8; font-size: .9em; }

  .site-footer {
    border-top: 1px solid var(--border); background: var(--bg-warm);
    padding: 1.75rem 0; font-size: .85rem; color: var(--text-muted);
  }
  .site-footer .container { display: flex; gap: 1.25rem; flex-wrap: wrap; }
  .site-footer a { color: var(--primary-dark); }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .themen-seite { padding: 2.4rem 0 3rem; }
  .themen-seite h1 { font-family: var(--font-display); font-size: 2.1rem; color: var(--primary-dark); line-height: 1.2; }
  .themen-seite .einleitung { color: var(--text-muted); margin: .6rem 0 1.6rem; max-width: 640px; }
  .themen-seite .container { max-width: 1100px; }
  .fuss { border-top: 1px solid var(--border); padding: 1.4rem 0 2.4rem; font-size: .85rem; color: var(--text-faint); }
  .fuss a { color: var(--text-faint); margin-right: 1rem; }
</style>

<script>
(function () {
  var KEY = 'papierpanther-leichte-sprache';
  var T = {
    h1: ['Themen im Überblick', 'Themen'],
    intro: ['Zu einigen Themen gibt es mehr als einzelne Tagesordnungspunkte: Zahlen, Rechner und Hintergründe. Hier finden Sie alle auf einen Blick.',
            'Zu diesen Themen gibt es mehr Infos. Zum Beispiel Zahlen und Rechner.']
  };
  var btn = document.getElementById('btn-leicht');
  var leicht = false;
  try { leicht = localStorage.getItem(KEY) === '1'; } catch (e) {}
  function anwenden() {
    btn.setAttribute('aria-pressed', leicht ? 'true' : 'false');
    document.getElementById('t-h1').textContent = T.h1[leicht ? 1 : 0];
    document.getElementById('t-intro').textContent = T.intro[leicht ? 1 : 0];
  }
  btn.addEventListener('click', function () {
    leicht = !leicht;
    try { localStorage.setItem(KEY, leicht ? '1' : '0'); } catch (e) {}
    anwenden();
  });
  anwenden();
})();
</script>
