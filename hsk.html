<style>
  :root {
    --primary: #003e59;
    --primary-dark: #00263a;
    --accent: #b00e2b;
    --text: #16232b;
    --text-muted: #566a74;
    --text-faint: #5c6a72;
    --bg: #f8f7f4;
    --bg-warm: #f1efe9;
    --card: #ffffff;
    --border: #e4e0d8;
    --border-strong: #8f8779;
    --warn-bg: #fdf6e7;
    --warn-border: #e8d9b0;
    --warn-tx: #7d6320;
    /* Gedeckt = Petrol (wie Einnahmen auf der Haushaltsseite), offen = Rot
       schraffiert, beeinflussbare Ausgaben in den Ockertoenen der Ausgaben. */
    --gedeckt: #2f7080;
    --einmalig: #93bcc5;
    --offen: #b00e2b;
    --offen-hell: #f6dfe3;
    --aus-1: #96551f;
    --aus-2: #b6752f;
    --aus-3: #cf9a55;
    --aus-fest: #d9d4ca;
    --trend: #b6752f;
    --konsol: #2f7080;
    --soll: #8f8779;
    --font-display: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(22,35,43,.06), 0 0 0 1px rgba(22,35,43,.04);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-body); color: var(--text); background: var(--bg);
    line-height: 1.65; font-size: 16px; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 0 1.5rem; }
  @media (max-width: 480px) { .container { padding: 0 1rem; } }
  a { color: var(--accent); }

  .site-header {
    background: var(--primary); border-bottom: 3px solid var(--accent);
    padding: .85rem 0; position: sticky; top: 0; z-index: 50;
  }
  .site-header .container { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
  .logo-mark { flex: none; display: block; }
  .brand {
    font-family: var(--font-display); font-size: 1.28rem; font-weight: 700;
    letter-spacing: -.01em; color: #fff; text-decoration: none;
  }
  .brand span { color: #a9c7d6; font-weight: 400; }
  .header-spacer { margin-left: auto; }
  .btn-zurueck {
    font-size: .82rem; font-weight: 600; text-decoration: none; color: #fff;
    background: none; border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: .3rem .85rem;
  }
  .btn-zurueck:hover { background: rgba(255,255,255,.14); }
  .btn-leicht {
    font: inherit; font-size: .82rem; cursor: pointer;
    background: none; border: 1px solid rgba(255,255,255,.5); color: #fff;
    padding: .3rem .75rem; border-radius: 999px;
  }
  .btn-leicht:hover { background: rgba(255,255,255,.14); }
  .btn-leicht[aria-pressed="true"] {
    background: #fff; color: var(--primary-dark); border-color: #fff; font-weight: 600;
  }

  main { padding: 3rem 0 3.5rem; }
  h1 {
    font-family: var(--font-display); font-size: clamp(1.75rem, 4.5vw, 2.4rem);
    font-weight: 700; letter-spacing: -.02em; margin-bottom: .5rem;
    /* Ohne eigene Zeilenhoehe erbte die Ueberschrift 1.65 vom Fliesstext und
       zerfiel in zwei weit auseinanderstehende Zeilen. */
    line-height: 1.18; max-width: 30ch; text-wrap: balance;
  }
  /* "Haushaltssicherungskonzept" passt auf dem Handy nicht in eine Zeile. */
  h1, h2, h3 { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .lede { color: var(--text-muted); font-size: 1.05rem; max-width: 62ch; margin-bottom: 1.25rem; }

  .disclaimer {
    background: var(--warn-bg); border-bottom: 1px solid var(--warn-border);
    color: var(--warn-tx); font-size: .74rem; padding: .5rem 0;
  }
  .disclaimer strong { font-weight: 600; }
  .disclaimer p { max-width: 680px; margin: 0; }

  h2 {
    font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
    margin: 3rem 0 .75rem; letter-spacing: -.01em;
  }
  h3 {
    font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
    margin: 1.5rem 0 .5rem;
  }
  p { margin-bottom: 1rem; max-width: 68ch; }
  em { font-style: italic; }

  .status-hinweis {
    background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius);
    color: var(--warn-tx); font-size: .88rem; line-height: 1.55; padding: .75rem 1rem;
    margin: 0 0 1.5rem; max-width: none; overflow-wrap: break-word; hyphens: auto;
  }
  .status-hinweis a { color: var(--warn-tx); }

  /* ---------- Kennzahlen ---------- */
  .kennzahlen {
    /* Zahlenleiste wie in der Zeitung statt einzelner Karten: Linie oben,
       feine Trennstriche zwischen den Zahlen (Designrunde 2026-10-26).
       overflow: hidden schneidet den linken Strich der ersten Spalte ab. */
    display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 0; margin: 0 0 1rem; border-top: 2px solid var(--text); overflow: hidden;
  }
  .kachel {
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin-left: -1px; padding: .8rem 1rem .9rem;
    min-width: 0; overflow-wrap: break-word; hyphens: auto;
  }
  .kachel p { margin: 0; }
  .kachel-label { font-size: .8rem; font-weight: 600; color: var(--text-muted); line-height: 1.4; min-height: 2.8em; }
  .kachel .kachel-wert {
    font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
    color: var(--text); line-height: 1.25; margin: .15rem 0 .3rem; white-space: nowrap;
  }
  .kachel.rot .kachel-wert { color: var(--accent); }
  .kachel-unter { font-size: .8rem; color: var(--text-faint); line-height: 1.45; }
  @media (max-width: 480px) {
    .kennzahlen { grid-template-columns: 1fr 1fr; }
    .kachel { padding: .7rem .75rem .8rem; }
    .kachel .kachel-wert { font-size: 1.2rem; }
    .kachel-label, .kachel-unter { font-size: .74rem; }
  }

  /* ---------- Aufklappbarer Erklaerkasten (wie auf der Haushaltsseite) ---------- */
  .aufklapp-abschnitt {
    /* Seit der Designrunde 2026-10-26 ohne Kasten: kraeftige Linie oben, feine
       unten. Erkennbar aufklappbar bleibt es ueber den runden Pfeil-Knopf. */
    margin: 2.5rem 0; border-top: 2px solid var(--text); border-bottom: 1px solid var(--border-strong);
  }
  .aufklapp-abschnitt summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 1rem;
    padding: 1rem 0; transition: background .12s ease;
  }
  .aufklapp-abschnitt summary::-webkit-details-marker { display: none; }
  .aufklapp-abschnitt summary:hover h2 { color: var(--accent); }
  .aufklapp-abschnitt summary:hover .aufklapp-chevron { background: var(--primary); color: #fff; }
  .aufklapp-abschnitt summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .aufklapp-abschnitt[open] summary { border-bottom: 1px solid var(--border); }
  .aufklapp-kopf { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .35rem; overflow-wrap: break-word; hyphens: auto; }
  @media (max-width: 480px) { .aufklapp-abschnitt summary { gap: .6rem; } }
  .aufklapp-abschnitt summary h2 { margin: 0; }
  .aufklapp-chevron { flex: none; display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border: 1px solid var(--primary); border-radius: 50%; font-size: 1.35rem; padding-top: .1rem; line-height: 1; color: var(--primary); transition: transform .18s ease, background .12s ease, color .12s ease; }
  .aufklapp-abschnitt[open] .aufklapp-chevron { transform: rotate(180deg); }
  .aufklapp-teaser { font-size: .95rem; font-weight: 400; color: var(--text-muted); max-width: 62ch; }
  .aufklapp-inhalt { padding: 1.25rem 0 1.5rem; }
  .aufklapp-inhalt h3:first-child { margin-top: 0; }

  /* ---------- Diagramm-Karten ---------- */
  .diagramm {
    /* Diagramme ohne Karte, nur mit Linie oben wie eine Grafik in der Zeitung.
       Kaesten bleiben dem Bedienbaren vorbehalten (Designrunde 2026-10-26). */
    border-top: 2px solid var(--text); padding: .9rem 0 0; margin: 1.5rem 0 2.25rem;
    max-width: 100%;
  }
    .diagramm svg { display: block; width: 100%; height: auto; font-family: var(--font-body); }
  .svg-scroll { overflow-x: auto; }
  @media (max-width: 640px) { .svg-scroll svg { width: 640px; } }
  .diagramm-titel { font-size: .95rem; font-weight: 600; color: var(--text); margin-bottom: .9rem; }
  .diagramm-lead { font-size: .92rem; color: var(--text); margin-bottom: 1rem; max-width: 68ch; }
  .diagramm-fuss { font-size: .78rem; color: var(--text-faint); margin-top: .75rem; margin-bottom: 0; }
  .legende { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .8rem; color: var(--text-muted); margin-bottom: .75rem; }
  .legende span { display: inline-flex; align-items: center; gap: .4rem; }
  .legende i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .legende i.offen, .seg.offen {
    background: repeating-linear-gradient(45deg, var(--offen-hell) 0 4px, #fff 4px 8px);
    box-shadow: inset 0 0 0 1px var(--offen);
  }
  .legende i.linie { height: 0; border-radius: 0; border-top: 2px dashed var(--soll); background: none; }
  .achse-text { font-size: 11px; fill: var(--text-faint); }
  .achse-linie { stroke: var(--border-strong); stroke-width: 1; }
  .gitter { stroke: var(--border); stroke-width: 1; }
  .ref-linie { stroke: var(--soll); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .ref-text { font-size: 11px; fill: var(--text-muted); paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
  .wert-text { font-size: 11px; fill: var(--text); font-weight: 600; paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }

  .tabs {
    display: flex; flex-wrap: wrap; gap: .25rem; border-bottom: 1px solid var(--border);
    margin: -.4rem 0 1.1rem;
  }
  .tabs [role="tab"] {
    font: inherit; font-size: .86rem; cursor: pointer; background: none; border: none;
    border-bottom: 3px solid transparent; margin-bottom: -1px;
    padding: .45rem .8rem .5rem; color: var(--text-muted);
  }
  .tabs [role="tab"]:hover { color: var(--text); background: var(--bg-warm); }
  .tabs [role="tab"][aria-selected="true"] { color: var(--primary); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- Schalter, Chips, Regler ---------- */
  .schalter-zeile { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin: 0 0 1rem; font-size: .88rem; }
  .schalter-zeile label { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; }
  .schalter-zeile input[type="checkbox"] { width: 1.05rem; height: 1.05rem; accent-color: var(--primary); }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 .9rem; }
  .chip {
    font: inherit; font-size: .82rem; cursor: pointer; background: var(--card); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 999px; padding: .25rem .75rem;
  }
  .chip:hover { background: var(--bg-warm); }
  .chip[aria-pressed="true"] { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip:focus-visible, .segbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .segmentiert { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
  .segbtn {
    font: inherit; font-size: .84rem; cursor: pointer; background: var(--card); color: var(--text);
    border: none; border-right: 1px solid var(--border); padding: .3rem .7rem;
  }
  .segbtn:last-child { border-right: none; }
  .segbtn[aria-pressed="true"] { background: var(--primary); color: #fff; font-weight: 600; }
  .steuer-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-bottom: 1rem; font-size: .86rem; color: var(--text-muted); }

  /* ---------- Zeitleiste ---------- */
  .zeitleiste { list-style: none; position: relative; margin: 1rem 0 0; padding-left: 1.6rem; }
  .zeitleiste::before { content: ""; position: absolute; left: .45rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--border); }
  .zeitleiste li { position: relative; margin-bottom: .35rem; }
  .zeitleiste li::before {
    content: ""; position: absolute; left: -1.38rem; top: .72rem; width: .8rem; height: .8rem;
    border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--bg);
  }
  .zeitleiste li.zukunft::before { background: var(--card); border: 2px solid var(--primary); }
  .zeitleiste li.heute-danach::before { background: var(--accent); }
  .zl-knopf {
    font: inherit; text-align: left; width: 100%; cursor: pointer; background: none; border: none;
    border-radius: 8px; padding: .4rem .6rem; display: flex; flex-wrap: wrap; gap: .1rem .75rem; align-items: baseline;
    color: var(--text);
  }
  .zl-knopf:hover { background: var(--bg-warm); }
  .zl-knopf:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  .zl-datum { font-size: .8rem; font-weight: 600; color: var(--text-muted); min-width: 6.8rem; font-variant-numeric: tabular-nums; }
  .zl-titel { font-weight: 600; flex: 1; min-width: 12rem; }
  .zl-text { font-size: .9rem; padding: 0 .6rem .6rem; margin: 0; }
  .zl-text a { color: var(--primary-dark); }
  .heute-marke { font-size: .72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin: .4rem 0 .4rem -1.6rem; padding-left: 1.6rem; border-top: 1px dashed var(--accent); padding-top: .2rem; list-style: none; }
  .heute-marke::before { display: none; }

  /* ---------- Luecken-Balken ---------- */
  .luecke-zeile { display: grid; grid-template-columns: 3.2rem 1fr; gap: .75rem; align-items: center; margin-bottom: .85rem; }
  .luecke-jahr { font-weight: 700; font-variant-numeric: tabular-nums; }
  .luecke-spur { position: relative; }
  .luecke-balken { display: flex; height: 30px; border-radius: 5px; overflow: hidden; background: var(--bg-warm); }
  .seg { height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .76rem; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }
  .seg.gedeckt { background: var(--gedeckt); }
  .seg.einmalig { background: var(--einmalig); color: var(--primary-dark); }
  .seg.offen { color: var(--offen); }
  .seg.ueber { background: #5c8f5a; }
  .luecke-text { font-size: .8rem; color: var(--text-muted); margin-top: .25rem; }
  .luecke-text strong { color: var(--text); }
  @media (max-width: 480px) { .luecke-zeile { grid-template-columns: 2.6rem 1fr; gap: .5rem; } .seg { font-size: .7rem; } }

  .rechenweg { width: 100%; border-collapse: collapse; font-size: .88rem; margin: .5rem 0 0; font-variant-numeric: tabular-nums; }
  .rechenweg td { padding: .3rem .4rem; border-bottom: 1px solid var(--border); }
  .rechenweg td:last-child { text-align: right; white-space: nowrap; }
  .rechenweg tr.summe td { font-weight: 700; border-top: 2px solid var(--text); border-bottom: none; }
  .rechenweg tr.abzug td { color: var(--text-muted); }
  .rechenweg-wrap { overflow-x: auto; }

  /* ---------- Massnahmen-Liste ---------- */
  .m-summe { font-size: .9rem; margin-bottom: .75rem; color: var(--text-muted); }
  .m-summe strong { color: var(--text); font-family: var(--font-display); font-size: 1.1rem; }
  .m-liste { list-style: none; display: grid; gap: .45rem; }
  .m-eintrag { border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .m-eintrag.ohne-wert { background: #fcfbf9; }
  .m-knopf {
    font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; background: none; border: none;
    display: grid; grid-template-columns: 1fr minmax(90px, 34%) 5.6rem; gap: .35rem .9rem; align-items: center;
    padding: .6rem .8rem; border-radius: 8px;
  }
  .m-knopf:hover { background: var(--bg-warm); }
  .m-knopf:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .m-titel { font-size: .92rem; font-weight: 600; line-height: 1.35; }
  .m-meta { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .25rem; }
  .badge { font-size: .7rem; font-weight: 600; border-radius: 4px; padding: .05rem .4rem; background: var(--bg-warm); color: var(--text-muted); white-space: nowrap; }
  .badge.beschlossen { background: #e3eef0; color: #14505c; }
  .badge.beratung { background: var(--warn-bg); color: var(--warn-tx); }
  .badge.offen, .badge.erwartet { background: #f3e9e9; color: #8a2a33; }
  .m-bar { height: 14px; background: var(--bg-warm); border-radius: 3px; position: relative; }
  .m-bar span { position: absolute; inset: 0 auto 0 0; background: var(--gedeckt); border-radius: 3px; min-width: 2px; }
  .m-bar span.einmalig { background: var(--einmalig); }
  .m-wert { text-align: right; font-variant-numeric: tabular-nums; font-size: .88rem; font-weight: 600; white-space: nowrap; }
  .m-wert.leer { color: var(--text-faint); font-weight: 400; }
  .m-details { padding: .2rem .8rem .9rem; font-size: .9rem; border-top: 1px solid var(--border); }
  .m-details p { margin: .6rem 0 .4rem; }
  .m-details dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .9rem; font-size: .84rem; margin-top: .5rem; }
  .m-details dt { color: var(--text-muted); }
  .m-details dd { margin: 0; overflow-wrap: anywhere; }
  .m-details dd a { color: var(--primary-dark); }
  .m-jahre { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; margin-top: .6rem; max-width: 26rem; }
  .m-jahre div { background: var(--bg-warm); border-radius: 6px; padding: .3rem .45rem; font-size: .78rem; text-align: center; }
  .m-jahre b { display: block; font-size: .88rem; font-variant-numeric: tabular-nums; }
  .m-original { font-size: .82rem; color: var(--text-muted); border-left: 3px solid var(--border); padding-left: .6rem; }
  .m-unterliste { list-style: none; margin-top: .6rem; display: grid; gap: .3rem; }
  .m-unterliste li { display: grid; grid-template-columns: 1fr auto; gap: .6rem; font-size: .84rem; padding: .35rem .5rem; background: var(--bg-warm); border-radius: 6px; }
  .m-unterliste li small { display: block; color: var(--text-muted); font-size: .78rem; }
  .m-unterliste .m-wert { font-size: .84rem; }
  @media (max-width: 560px) {
    .m-knopf { grid-template-columns: 1fr 5rem; }
    .m-bar { grid-column: 1 / -1; grid-row: 2; }
  }

  /* ---------- Ausgabenstruktur ---------- */

        "im Haushalt 2026 nicht genehmigt. Sie verlangt ein Haushaltssicherungskonzept, das zeigt, <em>wie</em> und " +
        "<em>bis wann</em> die Stadt wieder einen genehmigungsfähigen Haushalt aufstellen kann.</p>" +
        "<p>Das HSK ist deshalb kein weiteres Sparpaket, sondern ein verbindlicher Rahmen. Es legt ein Sparziel fest, " +
        "gibt Regeln für alle Ausgaben vor, sammelt die Maßnahmen in einer Liste und schreibt vor, dass regelmäßig " +

        "Unternehmen.</p>" +
        "<h3>Was heißt „vorläufige Haushaltsführung“?</h3>" +
        "<p>Solange kein Haushalt in Kraft ist, gilt Artikel 69 der Gemeindeordnung. Die Stadt darf dann nur zahlen, " +

        "fortführen. Neue freiwillige Ausgaben und neue Projekte sind nicht vorgesehen, auch keine " +

        "<p>Das HSK spricht deshalb von einem <em>strukturellen</em> Defizit: Die regelmäßigen Einnahmen bleiben " +

        zahl(kons[kons.length - 1]) + " Mio. €", "Diagramm: Schulden bis 2036") });
    [0, 200, 400, 600, 800].forEach(function (v) {
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "gitter" }));
      svg.appendChild(svgText(L - 6, y(v) + 4, zahl(v), "achse-text", "end"));
    });
    jahre.forEach(function (j, i) {
      if (i % 2 === 0 || i === jahre.length - 1) svg.appendChild(svgText(x(i), H - 8, j.replace("2025", t("heute", "jetzt")), "achse-text", "middle"));
    });
    svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: y(0), y2: y(0), class: "achse-linie" }));
    // Finanzplanung 2029 als Referenzpunkt
    var i29 = jahre.indexOf("2029");
    var fp = B.kredite_finanzplanung.schuldenstand_2029_mio;
    svg.appendChild(svgEl("circle", { cx: x(i29), cy: y(fp), r: 4.5, fill: "var(--card)", stroke: "var(--soll)", "stroke-width": 2 },
      [svgTitel(t("Finanzplanung zum Haushalt 2026: ", "Plan: ") + zahl(fp, 1) + " Mio. € im Jahr 2029")]));
    // Unter dem Punkt, zwischen den beiden Kurven: rechts daneben laeuft die Trendlinie.
    svg.appendChild(svgText(x(i29) + 6, y(fp) + 46, t("Finanzplan 2029: ", "Plan 2029: ") + zahl(fp, 0), "ref-text"));
    svg.appendChild(svgEl("line", { x1: x(i29), y1: y(fp) + 5, x2: x(i29) + 4, y2: y(fp) + 34, class: "ref-linie" }));
    function linie(werte, farbe, label) {
      var d = werte.map(function (v, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
      var flaeche = d + " L" + x(werte.length - 1) + " " + y(0) + " L" + x(0) + " " + y(0) + " Z";
      svg.appendChild(svgEl("path", { d: flaeche, fill: farbe, opacity: .08 }));
      svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: farbe, "stroke-width": 2.5, "stroke-linejoin": "round" }));
      werte.forEach(function (v, i) {
        svg.appendChild(svgEl("circle", { cx: x(i), cy: y(v), r: 3.2, fill: farbe },
          [svgTitel(label + " " + jahre[i] + ": " + zahl(v) + " Mio. €")]));
      });
      svg.appendChild(svgText(x(werte.length - 1) + 8, y(werte[werte.length - 1]) + 4, zahl(werte[werte.length - 1]) + " Mio.", "wert-text"));
    }
    linie(trend, "var(--trend)", t("Trend", "Alles bauen"));
    linie(kons, "var(--konsol)", t("Konsolidierung", "Nur Begonnenes"));
    var box = document.getElementById("sch-diagramm");
    box.innerHTML = "";
    box.appendChild(svg);
    document.getElementById("sch-fuss").innerHTML = t(
      "Summe der Kreditaufnahmen ab dem Bestand im September 2026, wie im HSK dargestellt; Tilgungen sind nicht abgezogen. " +
        "Beide Kurven sind Szenarien aus den Anmeldungen zum Haushalt 2027, keine Beschlüsse. Beim Trend rechnet das HSK " +
        "mit durchschnittlich " + zahl(S.trend_zinsen_mio, 1) + " Mio. € Zinsen und " + zahl(S.trend_tilgung_mio, 1) +
        " Mio. € Tilgung im Jahr (4 % Zins). Für " + S.zinsbindung_betrag_mio + " Mio. € der bisherigen Kredite endet die " +
        "Zinsbindung " + S.zinsbindung_ende + ". Quelle: HSK Seiten " + S._seite + "–" + S.szenarien.konsolidierung._seite + ".",
      "Die orange Linie: Die Stadt baut alles, was geplant ist. Dann hat sie 2036 etwa " + zahl(trend[trend.length - 1]) +
        " Millionen Euro Schulden. Die blaue Linie: Die Stadt baut nur fertig, was schon begonnen ist. " +
        "Dann sind es etwa " + zahl(kons[kons.length - 1]) + " Millionen Euro.");
  }

  var kz = { betrag: 10, zins: 4 };
  function zeigeKredit() {
    var F = B.schulden.faustregel;
    var inp = document.getElementById("kredit-betrag");
    inp.value = kz.betrag;
    segButtons("kredit-zins", [3, 4, 5].map(function (z) { return { wert: z, text: z + " %" }; }), kz.zins,
      function (w) { kz.zins = w; zeigeKredit(); });
    var r = kz.zins / 100, n = F.laufzeit_jahre;
    var rate = kz.betrag * r / (1 - Math.pow(1 + r, -n));
    var zinsen = rate * n - kz.betrag;
    document.getElementById("kredit-betrag-out").textContent = zahl(kz.betrag) + " Mio. €";
    document.getElementById("kredit-ergebnis").innerHTML = t(
      "<p>Jedes Jahr, 30 Jahre lang:</p><div class=\"ergebnis-zahl\">" + zahl(rate, 2) + " Mio. €</div>" +
        "<p>Insgesamt zahlt die Stadt " + zahl(rate * n, 1) + " Mio. € zurück, davon " + zahl(zinsen, 1) + " Mio. € Zinsen.</p>",
      "<p>Das kostet jedes Jahr:</p><div class=\"ergebnis-zahl\">" + zahl(rate, 2) + " Mio. €</div>" +
        "<p>30 Jahre lang. Davon sind " + zahl(zinsen, 1) + " Millionen Euro Zinsen.</p>");
    document.getElementById("kredit-fuss").innerHTML = t(
      "Gleichbleibende Jahresrate (Annuität). Das HSK nennt als Faustregel: " + F.kredit_mio + " Mio. € bei " + F.zins_prozent +
        " % und " + F.laufzeit_jahre + " Jahren kosten rund " + zahl(F.schuldendienst_mio, 2) + " Mio. € im Jahr (Seite " + F._seite +
        "); der kleine Unterschied zur Rechnung hier liegt am Rechenweg. Zum Vergleich: Für Kassenkredite, die kurzfristig " +
        "Zahlungslücken überbrücken, stieg der Zins 2026 von " + zahl(B.schulden.kassenkredit_zins_von, 2) + " auf " +
        zahl(B.schulden.kassenkredit_zins_bis, 2) + " %.",
      "Das ist eine Beispiel-Rechnung.");
  }

  function zeigeEinordnung() {
    var S = B.schulden;
    var trend = S.szenarien.trend.stand_2036 / 1e6, kons = S.szenarien.konsolidierung.stand_2036 / 1e6;
    document.getElementById("einordnung-inhalt").innerHTML = t(
      "<h3>Was Kredite kosten</h3>" +
      "<p>Zinsen und Tilgung zahlt die Stadt aus dem laufenden Haushalt, in dem schon heute Geld fehlt. Steigen die Zinsen, " +
        "wird es teurer; das HSK rechnet deshalb Szenarien mit 3 und 5 % durch. Für " + S.zinsbindung_betrag_mio + " Mio. € der " +
        "bisherigen Kredite endet die Zinsbindung " + S.zinsbindung_ende + ", dann muss neu verhandelt werden. Das HSK empfiehlt " +
        "deshalb lange und ausgewogene Zinsbindungen und eine Begrenzung zusätzlicher Kredite (Seite 50).</p>" +
      "<h3>Was Kredite ermöglichen</h3>" +
      "<p>Nach der Gemeindeordnung darf eine Stadt Kredite nur für Investitionen aufnehmen, also für Schulen, Straßen oder " +
        "Gebäude, und nur, wenn sie Zins und Tilgung dauerhaft tragen kann (Art. 71). Solche Anlagen werden Jahrzehnte genutzt; " +
        "über einen Kredit verteilen sich die Kosten auf die Jahre der Nutzung.</p>" +
      "<p>Auch Nicht-Investieren hat Kosten. Laut HSK wäre für den Erhalt der städtischen Gebäude inzwischen ein Mehrfaches " +
        "dessen nötig, was im Haushalt steht (Seite 44). Jede Sparmaßnahme muss deshalb einen „Zukunftsfähigkeitscheck“ " +
        "bestehen: Sie darf notwendige Investitionen nicht nur in die Zukunft verschieben und dadurch verteuern (Seiten 61–62).</p>" +
      "<h3>Nicht jede Schuld belastet den Haushalt gleich</h3>" +
      "<p>Das HSK unterscheidet bei den städtischen Unternehmen zwischen <em>rentierlichen</em> und <em>nicht rentierlichen</em> " +
        "Schulden. Rentierlich heißt: Zins und Tilgung werden aus eigenen Einnahmen bezahlt, etwa aus Gebühren für Wasser und " +
        "Abwasser, aus dem Energieverkauf oder aus Mieten der Wohnungsbaugesellschaft. Nicht rentierlich, also vom städtischen " +
        "Haushalt zu tragen, sind laut HSK rund " + S.beteiligungen_nicht_rentierlich_mio + " Mio. €, vor allem bei Bädern und " +
        "Busverkehr (Seite 42).</p>" +
      "<h3>Wie das HSK die Kredite steuern will</h3>" +
      "<ul class=\"liste-schlicht\">" +
        "<li>Vor jeder Investition sind Notwendigkeit, Folgekosten und die Wirtschaftlichkeit über den ganzen Lebenszyklus " +
        "darzustellen; billiger bauen darf nicht zu deutlich höheren Betriebskosten führen (Seiten 11, 26).</li>" +
        "<li>Zins und Tilgung, die aus einem Kredit folgen, werden bei jeder Investitionsentscheidung als eigenes Kriterium " +
        "offen ausgewiesen (Seite 52).</li>" +
        "<li>Förderdarlehen und Förderprogramme werden vorrangig genutzt, soweit sie wirtschaftlich vorteilhaft sind (Seite 53).</li>" +
        "<li>Erlöse aus Grundstücks- und Gebäudeverkäufen senken vollständig die nötigen Kredite (Seite 45).</li>" +
        "<li>Die Investitionsplanung reicht künftig zehn Jahre voraus, und eine Finanzierungsstrategie legt Laufzeiten, " +
        "Zinsbindungen und Refinanzierung fest. Das soll Planungssicherheit schaffen (Seiten 47, 53).</li>" +
      "</ul>" +
      "<p>Den Abstand zwischen den beiden Szenarien, " + zahl(kons) + " oder " + zahl(trend) + " Mio. € Schulden im Jahr 2036, " +
        "beschreibt das HSK selbst als „erheblichen politischen Steuerungs- und Priorisierungsbedarf“ (Seite 11). Welche " +
        "Projekte die Stadt umsetzt, entscheidet der Stadtrat.</p>",
      "<p>Geliehenes Geld kostet Zinsen. Und die Stadt muss es zurückzahlen. Das Geld fehlt dann für andere Dinge.</p>" +
      "<p>Die Stadt darf sich nur Geld leihen, um etwas zu bauen. Zum Beispiel eine Schule. Eine Schule hält viele Jahre. " +
        "So wird sie über viele Jahre bezahlt.</p>" +
      "<p>Wenn die Stadt nichts repariert, wird es später teurer. Auch das steht im Spar-Plan.</p>" +
      "<p>Manche Schulden bezahlen die Firmen der Stadt selbst. Zum Beispiel mit dem Geld für Wasser. " +
        "Andere Schulden muss die Stadt bezahlen. Zum Beispiel für die Bäder und die Busse.</p>" +
      "<p>Die Stadt will genau prüfen: Was kostet ein Bau in vielen Jahren? Sie will Förder-Geld nutzen. " +
        "Und sie plant 10 Jahre im Voraus.</p>" +
      "<p>Was gebaut wird, entscheidet der Stadt-Rat.</p>");
  }

  function zeigeQuellen() {

    [
      [t("Beschlussvorlage " + Q.vorlage_nr + " im Ratsinfoportal", "Das Papier im Rats-Info-Portal"), Q.vorlage],

      [t("Anlagen: Maßnahmenkatalog, Prüfmaßnahmen, freiwillige Leistungen (PDF, 19 Seiten)", "Die Listen zum Plan (PDF)"), Q.anlagen_pdf],

        "Summe 2027 die 87,7 TEUR der Zeile 001.7. Die Zahlen aus dem Konzepttext stehen mit Seitenangabe in " +

      "Wir haben alle Zahlen nach-gerechnet. Stand: " + esc(D.erzeugt_am) + ".")));

  /* ---------------- Tabs ---------------- */
  document.querySelectorAll('[role="tablist"]').forEach(function (leiste) {
    var tabs = Array.prototype.slice.call(leiste.querySelectorAll('[role="tab"]'));
    function aktiviere(tab, fokus) {
      tabs.forEach(function (x) {
        var an = x === tab;
        x.setAttribute("aria-selected", an ? "true" : "false");
        x.tabIndex = an ? 0 : -1;
        document.getElementById(x.getAttribute("aria-controls")).hidden = !an;
      });
      if (fokus) tab.focus();
    }
    tabs.forEach(function (tab, i) {
      tab.addEventListener("click", function () { aktiviere(tab); });
      tab.addEventListener("keydown", function (ev) {
        var ziel = null;
        if (ev.key === "ArrowRight") ziel = tabs[(i + 1) % tabs.length];
        if (ev.key === "ArrowLeft") ziel = tabs[(i - 1 + tabs.length) % tabs.length];
        if (ev.key === "Home") ziel = tabs[0];
        if (ev.key === "End") ziel = tabs[tabs.length - 1];
        if (ziel) { ev.preventDefault(); aktiviere(ziel, true); }
      });
    });
  });

  /* ---------------- Leichte-Sprache-Umschalter ---------------- */
  texteAnwenden();
  var btnLeicht = document.getElementById("btn-leicht");
  btnLeicht.setAttribute("aria-pressed", leicht ? "true" : "false");
  btnLeicht.addEventListener("click", function () {
    leicht = !leicht;
    btnLeicht.setAttribute("aria-pressed", leicht ? "true" : "false");
    try { localStorage.setItem(LS_KEY_LEICHT, leicht ? "1" : "0"); } catch (err) { /* Storage kann gesperrt sein */ }
    texteAnwenden();
  });
